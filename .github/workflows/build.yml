# Runs the tests on every push to main/develop and every pull request ("Test" is the check pull requests
# must pass), then publishes the exe as a workflow artifact named after its version
# (KspFlightPlanner-0.2.0.exe), downloadable without unzipping.
name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Builds the whole solution, so a change that breaks the WPF app fails here too.
      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Summarize results
        if: always()
        shell: pwsh
        run: |
          $files = Get-ChildItem test-results -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          if (-not $files) { "### Tests`nNo results (the build failed before the tests ran)." >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          foreach ($f in $files) {
            [xml]$trx = Get-Content $f.FullName
            $c = $trx.TestRun.ResultSummary.Counters
            "### Tests: $($c.passed) passed, $($c.failed) failed, $([int]$c.total - [int]$c.executed) skipped" >> $env:GITHUB_STEP_SUMMARY
            foreach ($r in $trx.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed') {
              "- ❌ ``$($r.testName)``" >> $env:GITHUB_STEP_SUMMARY
            }
          }

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results

  publish:
    name: Publish
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/KspFlightPlanner.App -c Release -o out

      - name: Name the exe after its version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Item out/KspFlightPlanner.exe).VersionInfo.ProductVersion.Split('+')[0]
          Move-Item out/KspFlightPlanner.exe "out/KspFlightPlanner-$v.exe"
          "exe=out/KspFlightPlanner-$v.exe" >> $env:GITHUB_OUTPUT
          Write-Host "Built $v"

      # archive: false uploads the exe itself (downloads unzipped); the artifact takes the file's name.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.version.outputs.exe }}
          archive: false
