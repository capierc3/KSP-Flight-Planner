// KSP Flight Planner add-on: haulers' port and role settings (docs/MATH.md §11.15). Needs ModuleManager.
// Every docking port gets "Haulers" (which haulers may dock there); every command pod and probe core gets "Hauler role".

@PART[*]:HAS[@MODULE[ModuleDockingNode],!MODULE[ModuleHaulerPort]]:FOR[KspFlightPlanner]
{
	MODULE
	{
		name = ModuleHaulerPort
	}
}

@PART[*]:HAS[@MODULE[ModuleCommand],!MODULE[ModuleHaulerRole]]:FOR[KspFlightPlanner]
{
	MODULE
	{
		name = ModuleHaulerRole
	}
}
