// KSP Flight Planner add-on: Traffic Controller's port and role settings (docs/MATH.md §11.15). Needs ModuleManager.
// Every docking port gets "Traffic" (which route craft may dock there); every command pod and probe core gets "Traffic role".

@PART[*]:HAS[@MODULE[ModuleDockingNode],!MODULE[ModuleTrafficPort]]:FOR[KspFlightPlanner]
{
	MODULE
	{
		name = ModuleTrafficPort
	}
}

@PART[*]:HAS[@MODULE[ModuleCommand],!MODULE[ModuleTrafficRole]]:FOR[KspFlightPlanner]
{
	MODULE
	{
		name = ModuleTrafficRole
	}
}
